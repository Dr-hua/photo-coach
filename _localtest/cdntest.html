<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>loadScript 回退测试</title>
<style>body{font:14px/1.6 system-ui;padding:20px;background:#111;color:#eee}
.ok{color:#4ADE80}.bad{color:#f87171}.dim{color:#888}</style></head>
<body>
<h3>loadScript 多源回退 —— 真机验证</h3>
<div id="out"></div>
<script>
var out = document.getElementById('out');
function log(cls, msg) {
  var d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
}

// —— 从 app.js 原样抄过来的实现 ——
function npmMirror(p) {
  var at = p.indexOf('@', 1);
  if (at < 0) return null;
  var name = p.slice(0, at), rest = p.slice(at + 1);
  var slash = rest.indexOf('/');
  if (slash < 0) return null;
  var ver = rest.slice(0, slash), path = rest.slice(slash + 1);
  return 'https://registry.npmmirror.com/' + name + '/' + ver + '/files/' + path;
}
var CDNS = [
  function (p) { return 'https://unpkg.com/' + p; },
  function (p) { return 'https://cdn.jsdelivr.net/npm/' + p; },
  npmMirror
];
function loadOne(src, timeout) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    var done = false;
    function fin(ok, err) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (ok) resolve(); else { if (s.parentNode) s.parentNode.removeChild(s); reject(err); }
    }
    s.src = src;
    s.async = true;
    s.onload = function () { fin(true); };
    s.onerror = function () { fin(false, new Error('load failed')); };
    document.head.appendChild(s);
    var timer = setTimeout(function () { fin(false, new Error('timeout')); }, timeout || 30000);
  });
}
var tried = [];
function loadScript(pkg) {
  var i = 0;
  function next(lastErr) {
    if (i >= CDNS.length) return Promise.reject(lastErr || new Error('all cdn failed'));
    var url = CDNS[i++](pkg);
    tried.push(url);
    var t0 = Date.now();
    return loadOne(url, 30000).then(function () {
      log('ok', '✓ 成功 ' + url + '  (' + (Date.now() - t0) + 'ms)');
    }).catch(function (e) {
      log('bad', '✗ 失败 ' + url + '  (' + (e.message) + ', ' + (Date.now() - t0) + 'ms)');
      return next(e);
    });
  }
  return next(null);
}

(async function () {
  try {
    await loadScript('@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    log(window.tf ? 'ok' : 'bad', window.tf ? '✓ window.tf 存在，版本 ' + tf.version.tfjs : '✗ window.tf 不存在');
  } catch (e) {
    log('bad', '✗ 全部源失败：' + e.message);
  }

  // 第二段：故意给一个不存在的包，验证三级全部失败后能正确 reject
  log('dim', '--- 下面测「全部失败」路径 ---');
  try {
    await loadScript('@tensorflow/this-does-not-exist-xyz@9.9.9/nope.js');
    log('bad', '✗ 不该成功');
  } catch (e) {
    log('ok', '✓ 三级全失败正确 reject：' + e.message + '（共试 ' + tried.length + ' 个 URL，前 1 个是上面成功的）');
  }
  window.__done = true;
})();
</script>
</body></html>
