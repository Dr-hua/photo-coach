<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Service Worker 缓存验证</title>
<style>body{font:14px/1.7 system-ui;padding:20px;background:#111;color:#eee}
.ok{color:#4ADE80}.bad{color:#f87171}.dim{color:#888}</style></head>
<body>
<h3>Service Worker 缓存验证</h3>
<div id="out"></div>
<script>
var out = document.getElementById('out');
function log(cls, msg) {
  var d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
}
var T0 = Date.now();
function t() { return Date.now() - T0; }

(async function () {
  // 1. 等 SW 注册
  if (!('serviceWorker' in navigator)) { log('bad', '✗ 浏览器不支持 SW'); return; }
  var reg;
  try {
    reg = await navigator.serviceWorker.ready;
    log('ok', '✓ SW 就绪 ' + t() + 'ms  scope=' + reg.scope);
  } catch (e) { log('bad', '✗ SW 未就绪：' + e.message); return; }

  var ctrl = navigator.serviceWorker.controller;
  log(ctrl ? 'ok' : 'dim', (ctrl ? '✓ 页面已被 SW 接管' : '· 页面暂未被接管（首次注册正常现象，刷新后接管）'));

  // 2. 看看缓存里有什么
  var names = await caches.keys();
  log('dim', '缓存空间: ' + JSON.stringify(names));
  var c = await caches.open('photo-coach-v30');
  var keys = await c.keys();
  log('dim', '预缓存条目 ' + keys.length + ' 个:');
  keys.forEach(function (k) { log('dim', '   ' + k.url.replace(location.origin, '')); });

  // 3. 冷启动拉一次 tfjs（会被 SW 存进缓存）
  var url = 'https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
  var t1 = Date.now();
  var r1 = await fetch(url);
  var b1 = await r1.blob();
  log('ok', '✓ 首次拉取 tfjs  ' + r1.status + '  ' + b1.size + ' B  ' + (Date.now() - t1) + 'ms  ' + t());

  // 4. 等 SW 写缓存
  await new Promise(function (r) { setTimeout(r, 800); });
  var hit = await c.match(url);
  log(hit ? 'ok' : 'bad', hit ? '✓ 已进缓存 (' + (await hit.clone().blob()).size + ' B)' : '✗ 没进缓存');

  // 5. 第二次拉，应该命中缓存
  var t2 = Date.now();
  var r2 = await fetch(url);
  var b2 = await r2.blob();
  var ms2 = Date.now() - t2;
  log('ok', '✓ 二次拉取 tfjs  ' + r2.status + '  ' + b2.size + ' B  ' + ms2 + 'ms  ' + t());
  log(ms2 < (Date.now() - t1) ? 'ok' : 'dim',
      ms2 < 50 ? '✓ 命中缓存判定通过（<50ms）' : '· 二次比首次快，但没到 50ms 以内，可能走了内存/磁盘缓存');

  window.__done = true;
})();
</script>
</body></html>
