<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>线上 SW 缓存检查</title>
<style>body{font:14px/1.7 system-ui;padding:20px;background:#111;color:#eee}
.ok{color:#4ADE80}.bad{color:#f87171}.dim{color:#888}</style></head>
<body>
<h3>线上 Service Worker 缓存检查</h3>
<div id="out"></div>
<script>
var out = document.getElementById('out');
function log(c, m) { var d = document.createElement('div'); d.className = c; d.textContent = m; out.appendChild(d); }
var U = 'https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js';

(async function () {
  if (!('serviceWorker' in navigator)) { log('bad', '✗ 不支持 SW'); return; }
  var reg = await navigator.serviceWorker.ready;
  log('ok', '✓ SW 就绪 scope=' + reg.scope + ' controller=' + (navigator.serviceWorker.controller ? '有' : '无'));

  var c = await caches.open('photo-coach-v30');
  var keys = await c.keys();
  log('dim', '缓存条目 ' + keys.length + ' 条');
  var pre = keys.filter(function (r) { return r.url.indexOf('unpkg') >= 0; });
  log(pre.length ? 'ok' : 'dim', '其中 unpkg 条目 ' + pre.length + ' 条' + (pre.length ? ' → ' + pre[0].url.replace('https://unpkg.com', '…') : ''));

  // 第一次 cors fetch：这次会真的联网（应该 1-3 秒）
  try {
    var t1 = Date.now(), r1 = await fetch(U), b1 = await r1.blob();
    log('ok', '✓ [1] 首次 fetch（cors）: ' + r1.status + ' ' + b1.size + 'B ' + (Date.now() - t1) + 'ms type=' + r1.type);
  } catch (e) { log('bad', '✗ [1] 首次 fetch 失败: ' + e.name + ' / ' + e.message); }

  // 缓存里现在是什么类型
  var hit = await c.match(U);
  log(hit ? 'ok' : 'bad', '[2] 缓存中 tfjs: ' + (hit ? 'type=' + hit.type + ' status=' + hit.status : '无'));

  // 第二次 fetch：应该命中缓存，几十毫秒
  try {
    var t2 = Date.now(), r2 = await fetch(U), b2 = await r2.blob();
    log('ok', '✓ [3] 二次 fetch: ' + r2.status + ' ' + b2.size + 'B ' + (Date.now() - t2) + 'ms type=' + r2.type);
  } catch (e) { log('bad', '✗ [3] 二次 fetch 失败: ' + e.name + ' / ' + e.message); }

  // script 标签（no-cors）
  try {
    var t3 = Date.now();
    await new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = U;
      s.onload = res; s.onerror = function () { rej(new Error('onerror')); };
      document.head.appendChild(s);
    });
    log(window.tf ? 'ok' : 'bad', '✓ [4] script 标签: ' + (Date.now() - t3) + 'ms  window.tf=' + (window.tf ? tf.version.tfjs : '无'));
  } catch (e) { log('bad', '✗ [4] script 标签失败: ' + e.message); }

  // 同源
  try {
    var t4 = Date.now(), r4 = await fetch('./app.js?v=30');
    log(r4.ok ? 'ok' : 'bad', '✓ [5] 同源 app.js: ' + r4.status + ' ' + (Date.now() - t4) + 'ms');
  } catch (e) { log('bad', '✗ [5] 同源失败: ' + e.message); }
})();
</script>
</body></html>
