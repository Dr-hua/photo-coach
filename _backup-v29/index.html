<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F6">
<title>拍照小助手</title>
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>

<header class="top">
  <div class="brand">拍照小助手</div>
  <div class="status" id="status">本地</div>
  <button class="help" id="btnHelp" title="说明">?</button>
</header>

<main>
  <section class="stage">
    <div class="view" id="view">
      <video id="video" playsinline muted autoplay></video>
      <img id="photo" alt="">
      <canvas id="overlay"></canvas>
      <div class="grid" id="grid" hidden>
        <i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i>
      </div>
      <div class="empty" id="empty">点下面的圆按钮开始</div>
      <div class="hintbox" id="hintbox" hidden></div>
      <div class="viewbar">
        <button class="vchip" id="btnDemo">演示</button>
        <button class="vchip" id="btnShot">平拍</button>
        <button class="vchip" id="btnGrid">网格</button>
      </div>
    </div>

    <div class="actions">
      <button class="side-btn" id="btnPhoto">相册</button>
      <button class="shutter" id="btnShoot"><span class="sh-label">开摄像头</span></button>
      <button class="side-btn" id="btnFlip">切后置</button>
    </div>

    <div class="subactions">
      <button class="save" id="btnSave" hidden>保存到相册</button>
      <button id="btnResume" hidden>恢复实时</button>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
    <div class="err" id="err" hidden></div>
  </section>

  <section class="side">
    <div class="tabs">
      <button class="on" data-tab="tips">提醒</button>
      <button data-tab="rules">规矩</button>
      <button data-tab="log">记录</button>
      <button data-tab="privacy">隐私</button>
    </div>

    <div class="panel" id="panel-tips"></div>

    <div class="panel" id="panel-rules" hidden>
      <div id="rulesList"></div>
      <button id="btnResetRules" class="wide">恢复默认</button>
    </div>

    <div class="panel" id="panel-log" hidden>
      <div id="logList"></div>
      <div class="logactions">
        <button id="btnExport">导出</button>
        <button id="btnClearLog">清空</button>
      </div>
    </div>

    <div class="panel" id="panel-privacy" hidden>
      <div class="kv"><span>上传</span><b>无</b></div>
      <div class="kv"><span>存照片</span><b>否</b></div>
      <button class="wide" id="btnConsent">AI 点评（需同意）</button>
      <button class="wide" id="btnClearAll">清空本地记录</button>
    </div>
  </section>
</main>

<div class="modal" id="help" hidden>
  <div class="modal-card">
    <h2>怎么用</h2>
    <p>点下面的圆按钮开摄像头，骨架线亮起来就能看提示。</p>
    <p>画面底部三个小按钮：演示、拍法（平拍／仰拍／俯拍轮换）、网格。</p>
    <p>识别、场景判断、水平仪全在本机算，照片不上传。</p>
    <div class="modal-actions"><button class="primary" id="helpClose">知道了</button></div>
  </div>
</div>

<div class="modal" id="consent" hidden>
  <div class="modal-card">
    <h2>让 AI 看一眼？</h2>
    <p>只用于这次，看完就删。</p>
    <button class="consent-row" id="agreeSelf" aria-pressed="false">我同意</button>
    <button class="consent-row" id="agreeOther" aria-pressed="false">已征得被拍者同意</button>
    <div class="modal-actions">
      <button id="consentNo">不用</button>
      <button class="primary" id="consentYes" disabled>继续</button>
    </div>
  </div>
</div>

<script src="rules.js"></script>
<script src="app.js?v=29"></script>
</body>
</html>
