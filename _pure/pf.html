<!doctype html><html><head><meta charset="utf-8"><title>纯 fetch（无 SW）</title>
<style>body{font:14px/1.7 system-ui;padding:20px;background:#111;color:#eee}
.ok{color:#4ADE80}.bad{color:#f87171}.dim{color:#888}</style></head><body>
<h3>纯 fetch 测试（此源未注册 Service Worker）</h3><div id="out"></div>
<script>
var out=document.getElementById('out');
function log(c,m){var d=document.createElement('div');d.className=c;d.textContent=m;out.appendChild(d);}
var U='https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
log('dim','SW controller = '+(navigator.serviceWorker.controller?'有':'无'));
(async function(){
  try{var t=Date.now();var r=await fetch(U);var b=await r.blob();
      log('ok','fetch unpkg: '+r.status+' '+b.size+'B '+(Date.now()-t)+'ms type='+r.type);
  }catch(e){log('bad','fetch unpkg 失败: '+e.name+' / '+e.message);}
  try{var t2=Date.now();var r2=await fetch('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
      var b2=await r2.blob();log('ok','fetch jsdelivr: '+r2.status+' '+b2.size+'B '+(Date.now()-t2)+'ms');
  }catch(e){log('bad','fetch jsdelivr 失败: '+e.name+' / '+e.message);}
  try{var t3=Date.now();var r3=await fetch('https://registry.npmmirror.com/@tensorflow/tfjs/4.22.0/files/dist/tf.min.js');
      var b3=await r3.blob();log('ok','fetch npmmirror: '+r3.status+' '+b3.size+'B '+(Date.now()-t3)+'ms');
  }catch(e){log('bad','fetch npmmirror 失败: '+e.name+' / '+e.message);}
  try{var t4=Date.now();var r4=await fetch('./x.txt');log('dim','fetch 同源: '+r4.status+' '+(Date.now()-t4)+'ms');}catch(e){log('dim','同源 fetch 未测');}
  window.__done=1;
})();
</script></body></html>
